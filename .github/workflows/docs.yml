name: docs

on:
  push:
    branches: [main]
  pull_request:

jobs:
  roadmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Plan, steps and roadmap agree
        run: python scripts/build_roadmap.py --check
